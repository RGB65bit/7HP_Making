<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ななたまカウンター</title>
        <!-- Kaisei Tokumin, Dela Gothic, Google Sans, M Plus1, Noto Sans, Noto Srtif読み込み -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Kaisei+Tokumin&family=M+PLUS+1:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <!-- 個別でMochiy Pop Oneだけロード -->
        <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
        <!-- 可能なら後で.style.cssにしてlink relで読み込むようにする -> やっぱめんどくせぇ-->
        <style>
            *{font-family:'Mochiy Pop One'}
            body {                
                background-color: #63aed9;
                color:#FFC547;
            }
           .header {
                font-size:24px;
                background-color: #FFC547;
                font-weight:normal;
                margin:0;            
                position: fixed;
                top:0px;
                left:0px;
                width:100%;
            }
            nav{
                justify-content: space-around;
                overflow: hidden;
                display:flex;
            }
            nav a {
                padding: 10px;
                border: 3px solid #FFF;
                text-align: center;
                width: 100%;
                margin:0;
                text-decoration: none;
                color: #63aed9;
            }
            .headershape {
                background-color: #63aed9;
                height: 10px;
                width: 100%;
            }
            h1{
                margin:0;
                color:#63aed9;
                padding-left:10px;
            }
            .content {
                line-height:1;
                font-size: 40px;
                margin:0px;
                text-align: center;
                color: #ffc547;
                margin-top: 20px;
            }
            .content2 {
                font-size: 20px;
                text-align: center;
                color: #ffc547;
                margin:0px;
                display: flex;
                justify-content: center;
                text-align: center;
                align-items: center;
            }
            .content3 {
                font-size: 20px;
                text-align: center;
                color: #ffc547;
                margin:0px;
                display: flex;
                justify-content: center;
                text-align: center;
                align-items: center;
            }
            #ShareToX {
                display: block;
                margin: 20px auto;
                padding: 10px 20px;
                font-size: 16px;
                background-color: #FFC547;
                color: #63aed9;
                border: 2px solid #FFF;
                cursor: pointer;
            }
            select {
                margin:10px;
                padding: 10px 10px;
                font-size: 16px;
                background-color: #FFC547;
                color: #63aed9;
                border: 2px solid #FFF;
                border-radius: 5px;
                cursor: pointer;
            }
            select option {
                background-color: #FFF;
                color: #63aed9;
            }
            .UpdateBottun{
                margin:10px;
                padding: 10px 10px;
                font-size: 16px;
                background-color: #FFC547;
                color: #63aed9;
                border: 2px solid #FFF;
                border-radius: 5px;
                cursor: pointer;
            }
            .line{
                display:flex;
                justify-content: flex-start;
                align-items:center;
            }
        </style>
    </head>
    <body>
        <!-- ヘッダーを設計 -->
        <div class="header">
            <h1 style="font-family:'Mochiy Pop One'">ななたまカウンター</h1>
            <nav>
                <a href="#">hoge1</a>
                <a href="#">hoge2</a>
                <a href="#">hoge3</a>
            </nav>
        </div>
        <div style="padding-top: 150px;">
            <img style="background-color:#FFFFFF; display:block; margin:0 auto; width:35%; height:auto; border-radius:50%; border: 4px solid #FFC547; box-shadow: 0 0 70px rgba(255, 255, 255, 0.3);" src="https://images.microcms-assets.io/assets/5694fd90407444338a64d654e407cc0e/f76ae3abb42440108fb75605bdd764e7/liver-face_Nana_Tamanoi.png" alt="Nana Tamanoi">
        </div>
        <!-- 主のカウントアッパー -->
        <div class="content">
            <p>珠乃井ナナがデビューしてから...</p>
            <div id="NanatamaLiveCounter"></div> 
        </div>
        <!-- 総経過秒数と現在時刻を表示する -->
        <div class="content2">
            <p>総経過秒数は、</p>
            <div id="totalSeconds"></div>
            <p>秒です！</p>
        </div>
        <div class="content3">
            <p>現在時刻：</p>
            <div id="currentTime"></div>
        </div>
        <!-- attention的な -->
        <p style="margin-top:0; text-align:center;">(デビュー日時を2024年6月19日18:00(日本時間)として扱っています。)</p>
        <!-- Please Share! -->
        <a style="text-decoration:none;" id="PostingLink" href="" target="_blank"><button id="ShareToX">Xに共有(ポストの作成画面が開きます！)</button></a>
        <!-- なんか見にくいから仕切り～ -->
        <div id="border" style="border: 1px solid #FFF; width: 95%;"></div>

        <div class="line">
            <p>色々換算してみると...</p>
            <select id="WhatCanWeDoInTheTime">
                <option value="Beats">心拍</option>
                <option value="Syaoran">シャオシャオ蘭々</option>
                <option value="Dokikyun">どきどきキュン！で大暴走♡</option>
                <option value="Muriota">無理すぎ♡オタクハート</option>
                <option value="Kcal">熱量</option>
                <option value="Film">フィルム</option>
                <option value="RawVideo">動画</option>
            </select>
            <button class="UpdateBottun">更新！</button>
        </div>
        <div style="margin-bottom: 24px;" class="Iroiro">これまで...</div>

        <script>
            let NanaLiveSecond = 0;
            let NanaLiveDay = 0;
            function NanatamaLiveTime(){ //でっかいカウントの処理
                const NanaDebutYear = 2024  //値を設定
                const NanaDebutMonth = 6 - 1
                const NanaDebutDay = 19
                const NanaDebutHour = 18
                const NanaDebutMin = 0
                const NanaDebutSec = 0
                const NanaDebut = Math.floor(new Date(NanaDebutYear, NanaDebutMonth, NanaDebutDay, NanaDebutHour, NanaDebutMin, NanaDebutSec).getTime() / 1000);
                const NanaNow = Math.floor(Date.now() / 1000); //現在のUNIX時間を取得
                const NanaDifference = NanaNow - NanaDebut //差分秒を計算する
                const NanaNowSec = NanaDifference % 60; //UNIX時間を60で割ったあまりを求め、秒数を確定
                const NanaNowMinTemp = Math.floor(NanaDifference / 60); //UNIX時間を60で割った商のみを求め、分数を計算しやすくする(小数点以下は秒数となる)
                const NanaNowMin = NanaNowMinTemp % 60; //分数を60で割ったあまりを求め、分数を確定
                const NanaNowHouTemp = Math.floor(NanaNowMinTemp / 60); //分数を60で割った商のみを求め、時間数を計算しやすくする(少数点以下は分数となる)
                const NanaNowHou = NanaNowHouTemp % 24; //時間数を24で割ったあまりを求め、時間数を確定
                const NanaDay = Math.floor(NanaNowHouTemp / 24); //時間数を24で割った商のみを求め、日数を確定
                NanaLiveSecond = NanaDifference; //グローバル変数にしてやろう、他の関数でも使う
                NanaLiveDay = NanaDay;
                document.getElementById('NanatamaLiveCounter').textContent = `${NanaDay}日と ${NanaNowHou}時間 ${NanaNowMin}分 ${NanaNowSec}秒  経過しました！`; //文字列更新
                document.getElementById('PostingLink').href = `https://x.com/intent/post?text=` + encodeURIComponent(`珠乃井ナナがデビューしてから、${NanaDay}日と${NanaNowHou}時間${NanaNowMin}分${NanaNowSec}秒経過しました！\nhogehoge.hoge//ここに本来のリンクをいれる`); //Xのリンク更新
            };
            function GetNowTime() { //いわば時計
                const now = new Date();
                const currentTimeString = now.toLocaleString();
                document.getElementById('currentTime').textContent = currentTimeString;
            };
            function GetTotalSeconds() { //デビューからの総経過秒数の計算
                const now = new Date();
                const totalSeconds = Math.floor(now.getTime() / 1000);
                document.getElementById('totalSeconds').textContent = totalSeconds;
            };
            function SelectedThings(){ //プルダウンに応じて表示を変えたり
                const Selected = document.getElementById('WhatCanWeDoInTheTime').value;
                if (Selected === "Beats") {
                    const Beats = Math.floor(NanaLiveSecond / 60 * 70); //経過時間を60で割って70を掛ける
                    document.querySelector('.Iroiro').textContent = `これまでに、ななたまの心臓が、${Beats}回生きた証を残しました。(BPM70想定)`;
                } else if (Selected === "Syaoran") {
                    const ranran = Math.floor(NanaLiveSecond / (3*60 +52)); //1曲3分52秒なんで
                    document.querySelector('.Iroiro').textContent = `これまでに、シャオシャオ蘭々を、${ranran}回分聴けました。`;
                } else if (Selected === "Dokikyun") {
                    const Dokikyun = Math.floor(NanaLiveSecond / (3*60 +12)); //1曲3分12秒なんで
                    document.querySelector('.Iroiro').textContent = `これまでに、どきどきキュン！で大暴走♡した回数は、${Dokikyun}回分になります。`;
                } else if (Selected === "Muriota") {
                    const Muriota = Math.floor(NanaLiveSecond / (3*60)); //1曲丁度3分なんで
                    document.querySelector('.Iroiro').textContent = `これまでを、無理すぎ♡オタクハートに換算すると、${Muriota}回分になります。(ほかにも、カップラーメンが${Muriota}個食える！)`;
                } else if (Selected === "Kcal") {
                    const Kcal = Math.floor(NanaLiveSecond * (2000 / 86400) ); //カロリーって平均出しにくそうだよね
                    document.querySelector('.Iroiro').textContent = `これまでに、活発な女の子が私達にくれたエネルギーは、${Kcal}kcalです。(1日2000kcal想定)`;
                }
                else if (Selected === "Film") {
                    const FilmMeter = Math.floor(NanaLiveSecond *0.4572); //24fps35mm標準のフィルムは、1秒で457mm巻かれる
                    const FilmKiro = (FilmMeter / 1000); //キロメートルへ
                    const FilmKiroRounded = Math.trunc(FilmKiro); //小数点捨
                    const Rate = FilmKiro/11500000; //比を計算
                    const RatePercent = (Rate * 100).toFixed(4); //パーセント変換
                    document.querySelector('.Iroiro').textContent = `いままでの記憶のフィルムは、${FilmKiro}キロメートルになります。\n115万キロに占める比率は、1150000:${FilmKiroRounded}で、約${RatePercent}%です。`;
                }
                else if (Selected === "RawVideo"){
                    const BytePerSeconds = (3840 * 2160 * 60 * 3);
                    const KiroBytePerSeconds = BytePerSeconds / 1000
                    const Mega = KiroBytePerSeconds / 1000
                    const Giga = Mega /1000
                    const Tela = Giga /1000
                    const FileSizeTela = NanaLiveSecond * Tela
                    const FileSizeTelaRounded = Math.floor(FileSizeTela) 
                    document.querySelector('.Iroiro').textContent = `いままでを、4K60fpsかつ非圧縮で記録すると、約${FileSizeTelaRounded}テラバイトになります。`;
                };
            };
            document.querySelector('.UpdateBottun').addEventListener('click', SelectedThings); //更新ボタン押下時に実行
            setInterval(NanatamaLiveTime, 1000); //1000msごとに実行
            setInterval(GetNowTime, 1000);
            setInterval(GetTotalSeconds, 1000);
            NanatamaLiveTime(); //ページを開いた直後に実行
            GetNowTime(); //ページを開いた直後に実行
            GetTotalSeconds(); //ページを開いた直後に実行
        </script>
    </body>
</html>
